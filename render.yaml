# Render.com blueprint. Push this repo to GitHub, then in Render:
# New + -> Blueprint -> pick your repo. It reads this file automatically.
# After it deploys, add your keys under the service's "Environment" tab
# (do NOT commit real keys — .env is gitignored).
services:
  - type: web
    name: reelcheck
    runtime: docker
    plan: free
    envVars:
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_LLM_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: DEEPGRAM_API_KEYS
        sync: false
      - key: ASSEMBLYAI_API_KEYS
        sync: false
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEYS
        sync: false
      - key: TAVILY_API_KEYS
        sync: false
      - key: BRAVE_API_KEYS
        sync: false
      - key: STATS_TOKEN
        sync: false
      - key: YTDLP_PROXY
        sync: false                # residential proxy URL — makes IG/YouTube work on the cloud
      - key: DONATE_URL
        sync: false                # your UPI/Razorpay/Ko-fi link for the donate button
      - key: ADSENSE_CLIENT
        sync: false                # e.g. ca-pub-1234567890 (optional, once AdSense-approved)
      - key: ADSENSE_SLOT
        sync: false                # AdSense ad-unit slot id (optional)
      - key: SNAPWIDGET_ID
        sync: false                # SnapWidget id for the Instagram grid (optional)
      - key: ENABLE_LOCAL_WHISPER
        value: "0"
